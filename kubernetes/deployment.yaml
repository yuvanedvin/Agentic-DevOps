apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-devops-app
  labels:
    app: agentic-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentic-devops-app
  template:
    metadata:
      labels:
        app: agentic-devops-app
    spec:
      containers:
        - name: app
          image: ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/agentic-devops/application:IMAGE_TAG
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi